name = "invitestory-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "invitestory-db"
database_id = "local-db-id"

[[r2_buckets]]
binding = "R2"
bucket_name = "invitestory-artifacts"

[vars]
ENVIRONMENT = "development"

[dev]
port = 8787
ip = "127.0.0.1"